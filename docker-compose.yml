# Déploiement sur la Ofelia Box (Raspberry Pi 5) — FEAT-020 / Task #18.
#
# RÉFÉRENCE : le déploiement réel est piloté par le dépôt keebee, qui clone ce
# dépôt au moment de l'installation et intègre ces deux services à son propre
# docker-compose.yml (cf. keebee/docs/specs/FEAT-029-bibliofelia.md). Ce fichier
# documente la forme attendue des services et reste utilisable tel quel si le
# réseau `edubox-net` existe déjà.
#
# Dev local : utiliser docker-compose.dev.yml.
services:
  bibliofelia:
    image: ofelia/bibliofelia:${BIBLIOFELIA_TAG:-stable}
    build:
      context: .
      target: prod
    container_name: edubox-bibliofelia
    restart: unless-stopped
    volumes:
      - bibliofelia-data:/app/data
      - bibliofelia-media:/app/media
      - bibliofelia-static:/app/staticfiles
      - /etc/avahi/services:/etc/avahi/services
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${BIBLIOFELIA_SECRET_KEY}
      ALLOWED_HOSTS: "*"
      DATABASE_PATH: /app/data/bibliofelia.sqlite3
      FORCE_SCRIPT_NAME: /bibliofelia
      STATIC_URL: /bibliofelia/static/
      MEDIA_URL: /bibliofelia/media/
      API_BASE_PATH: /bibliofelia/api/v1/
      SECURE_COOKIES: "false"
      DEFAULT_LANGUAGE: fr
      ENABLED_LANGUAGES: "fr,en,es,mg"
      OPENLIBRARY_BASE_URL: https://openlibrary.org
      CSRF_TRUSTED_ORIGINS: ${BIBLIOFELIA_CSRF_TRUSTED_ORIGINS:-}
    networks:
      - edubox-net

  bibliofelia-worker:
    image: ofelia/bibliofelia:${BIBLIOFELIA_TAG:-stable}
    build:
      context: .
      target: prod
    container_name: edubox-bibliofelia-worker
    restart: unless-stopped
    # Pas d'entrypoint.sh : les migrations / seed / collectstatic sont faits
    # par le conteneur web. Le worker attend simplement que web soit healthy.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "manage.py", "qcluster"]
    # Le HEALTHCHECK du Dockerfile pingle :8001 (gunicorn) ; le worker n'écoute
    # pas, on le désactive pour qu'il n'apparaisse pas comme `unhealthy`.
    healthcheck:
      disable: true
    volumes:
      - bibliofelia-data:/app/data
      - bibliofelia-media:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${BIBLIOFELIA_SECRET_KEY}
      DATABASE_PATH: /app/data/bibliofelia.sqlite3
      DEFAULT_LANGUAGE: fr
      ENABLED_LANGUAGES: "fr,en,es,mg"
      OPENLIBRARY_BASE_URL: https://openlibrary.org
    networks:
      - edubox-net
    depends_on:
      bibliofelia:
        condition: service_healthy

volumes:
  bibliofelia-data:
  bibliofelia-media:
  bibliofelia-static:

networks:
  edubox-net:
    external: true
