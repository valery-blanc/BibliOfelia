{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Connexion" %}{% endblock %}

{% block content %}
<article style="max-width: 28rem; margin: 4rem auto;">
    <h1>{% trans "Connexion" %}</h1>
    {% if form.errors %}
        <p style="color: var(--pico-color-red-500)">{% trans "Identifiants invalides." %}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>
            {% trans "Nom d'utilisateur" %}
            <input type="text" name="username" autofocus required>
        </label>
        <label>
            {% trans "Mot de passe" %}
            <input type="password" name="password" required>
        </label>
        <button type="submit">{% trans "Se connecter" %}</button>
    </form>
</article>
{% endblock %}
