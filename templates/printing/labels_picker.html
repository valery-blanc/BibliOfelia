{% extends "printing/_picker_base.html" %}
{% load i18n biblio_icons %}

{# Étiquettes « code Ofelia » : planche A4 ou ruban 62 mm (FEAT-075). #}

{% block picker_buttons %}
    <button type="submit" class="btn btn--primary">
        {% icon "file-text" size="16px" %} {% trans "PDF A4" %}
    </button>
    {% if roll.enabled %}
    <button type="submit" formaction="{% url 'printing:labels_roll_pdf' %}" formtarget="_blank" class="btn btn--primary">
        {% icon "printer" size="16px" %} {% blocktrans with w=roll.tape_width_mm %}Ruban {{ w }} mm (Brother QL){% endblocktrans %}
    </button>
    {% endif %}
{% endblock %}
