{# Rendu d'un champ de formulaire. Usage : {% include "partials/_field.html" with field=form.xxx %} #}
<div class="field">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<small class="help-hint">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
