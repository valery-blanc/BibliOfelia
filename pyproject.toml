[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | \.venv
  | static
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_django = "django"
known_first_party = ["config", "apps"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["**/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "static", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # géré par black

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# --ds force les settings de test : `--reuse-db` seul laisserait une variable
# d'environnement DJANGO_SETTINGS_MODULE (posée par dev-entrypoint.sh) prendre
# le dessus et faire tourner la suite sous les settings de dev.
addopts = "--reuse-db --strict-markers --ds=config.settings.test"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
