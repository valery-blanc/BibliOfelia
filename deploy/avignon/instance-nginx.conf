# nginx d'une instance BibliOfelia hébergée sur Avignon (FEAT-056).
#
# Déployé à `~/docker/bibliofelia-instances/nginx.conf` — fichier **partagé**
# par toutes les instances (sanjuan, grand-saconnex), monté en lecture seule
# dans `bo-<instance>-nginx`. Copie versionnée ici pour tracer les changements.
#
# Après modification :
#   scp deploy/avignon/instance-nginx.conf \
#       avignon:/home/val/docker/bibliofelia-instances/nginx.conf
#   ssh avignon 'docker restart bo-sanjuan-nginx bo-grand-saconnex-nginx'

server {
    listen 80;
    client_max_body_size 50m;

    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 7d;
    }
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
    }

    # FEAT-057 — Guide utilisateur. Le bouton « ? » de la topbar pointe sur
    # `<préfixe app>/docs/` ; ici l'app est servie à la racine, donc `/docs/`.
    # Sur la Box (Pi) c'est nginx keebee qui sert le guide embarqué sous
    # `/bibliofelia/docs/` ; sur Avignon on réutilise le conteneur MkDocs déjà
    # en place pour docs.bibliofelia.org (réseau `web`, partagé).
    # `resolver` + variable : l'IP du conteneur docs est résolue à chaque requête,
    # donc un redémarrage de `bibliofelia-docs` ne casse pas ce nginx.
    location = /docs {
        return 301 /docs/;
    }
    location /docs/ {
        resolver 127.0.0.11 valid=30s;
        set $docs_upstream bibliofelia-docs;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_pass http://$docs_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # `resolver` + variable ici aussi : avec un `proxy_pass http://web:8001` en
    # dur, nginx résout l'IP du conteneur `web` **au démarrage** et sert des 502
    # dès que `web` est recréé après lui (ordre de redémarrage quelconque —
    # rebuild d'image, `compose up -d web`…). Constaté le 2026-08-03.
    location / {
        resolver 127.0.0.11 valid=30s;
        set $app_upstream web;
        proxy_pass http://$app_upstream:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
