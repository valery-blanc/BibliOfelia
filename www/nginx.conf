server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
