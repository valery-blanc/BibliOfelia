site_name: Guide BibliOfelia
site_description: Guide utilisateur pour les bibliothecaires
site_author: Projet Ofelia
site_url: http://ofelia.local/bibliofelia/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: fr
  custom_dir: overrides
  font: false  # pas de Google Fonts — contrainte hors-ligne (extra.css charge Bricolage + DM Sans en local)
  logo: assets/img/ofelia-logo.png
  favicon: assets/img/ofelia-logo.png
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - fr
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Premiers pas: Getting started
            Catalogue: Catalog
            Usagers: Members
            Prêts: Loans
