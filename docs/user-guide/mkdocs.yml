markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Pages conservees mais hors navigation (reintegration ulterieure possible).
not_in_nav: |
  /ofeliascan/

nav:
  - Premiers pas:
      - Accueil: index.md
      - Se connecter: premiers-pas/connexion.md
      - Tour du dashboard: premiers-pas/dashboard.md
      - Changer de langue: premiers-pas/langue.md
      - Modes de saisie: premiers-pas/saisie.md
      - Scanner avec la caméra: premiers-pas/scanner-camera.md
  - Catalogue:
      - Ajouter un livre: catalogue/ajouter-livre.md
      - Gérer les exemplaires: catalogue/exemplaires.md
      - Localisations: catalogue/localisations.md
      - Recherche: catalogue/recherche.md
      - Opérations en lot: catalogue/operations-lot.md
      - Récolement: inventaire/recolement.md
      - Cataloguer en scannant: inventaire/catalogage-scan.md
      - Cataloguer depuis Excel: inventaire/catalogage-excel.md
  - Usagers:
      - Inscrire un membre: usagers/inscription.md
      - Fiche membre: usagers/fiche.md
      - Carte de membre: usagers/carte.md
      - Renouvellement et expiration: usagers/renouvellement.md
  - Prêts:
      - Faire un prêt: prets-retours/faire-pret.md
      - Enregistrer un retour: prets-retours/retour.md
      - Prolonger un prêt: prets-retours/prolongation.md
      - Consultation sur place: prets-retours/consultation.md
      - Créer une réservation: reservations/creer.md
      - Notifications et relances: reservations/notifications.md
      - Retrait et expiration: reservations/retrait.md
  - Impressions:
      - Cartes de membres: impressions/cartes.md
      - Étiquettes de livres: impressions/etiquettes.md
  - Rapports:
      - KPIs du dashboard: rapports/kpis.md
      - Exports CSV: rapports/exports.md
  - FAQ: faq.md
  - Glossaire: glossaire.md
